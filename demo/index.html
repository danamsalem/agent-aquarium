<!doctype html>
<html lang="en" data-theme="aquarium" class="fonts-wait">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Aquarium demo</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* ---------- theme tokens ---------- */
:root[data-theme="warm"] {
  --bg: #1f1e1d; --fg: #f0eee6; --muted: rgba(240,238,230,.56);
  --accent-base: #d97757; --warn: #f2b350; --ok: #a8c9a0;
  --card: rgba(255,255,255,.045); --card-border: rgba(240,238,230,.1); --card-shadow: none;
  --head-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; --body-font: ui-sans-serif, -apple-system, sans-serif;
  --h-size: clamp(44px, 9.8vw, 142px); --h-weight: 400; --h-track: -0.025em; --em-style: italic;
  --radius: 14px; --body-size: 15px;
}
:root[data-theme="pixel"] {
  --bg: #0d0c0b; --fg: #f3e9dc; --muted: #8a8378;
  --accent-base: #ff7a4d; --warn: #ffd23f; --ok: #63f5a0;
  --card: rgba(255,122,77,.06); --card-border: rgba(255,122,77,.35); --card-shadow: none;
  --head-font: "Press Start 2P", ui-monospace, monospace; --body-font: "VT323", ui-monospace, monospace;
  --h-size: clamp(22px, 5.2vw, 70px); --h-weight: 400; --h-track: 0; --em-style: normal;
  --radius: 0; --body-size: 22px;
}
:root[data-theme="cosmic"] {
  --bg: #090718; --fg: #f4f1ff; --muted: rgba(244,241,255,.6);
  --accent-base: #ff9a76; --warn: #ffcf5c; --ok: #7ee0c3;
  --card: rgba(255,255,255,.06); --card-border: rgba(255,255,255,.13); --card-shadow: 0 10px 40px -12px rgba(0,0,0,.5);
  --head-font: "Space Grotesk", ui-sans-serif, sans-serif; --body-font: "Space Grotesk", ui-sans-serif, sans-serif;
  --h-size: clamp(42px, 9vw, 126px); --h-weight: 700; --h-track: -0.035em; --em-style: normal;
  --radius: 18px; --body-size: 15px;
}
:root[data-theme="aquarium"] {
  --bg: #062a4a; --fg: #eaf7ff; --muted: rgba(234,247,255,.64);
  --accent-base: #5fd3ff; --warn: #ffd166; --ok: #8ef0a8;
  --card: rgba(255,255,255,.08); --card-border: rgba(255,255,255,.16); --card-shadow: 0 10px 30px -12px rgba(0,20,40,.45);
  --head-font: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, sans-serif; --body-font: ui-rounded, "SF Pro Rounded", -apple-system, sans-serif;
  --h-size: clamp(42px, 9.2vw, 130px); --h-weight: 600; --h-track: -0.03em; --em-style: normal;
  --radius: 18px; --body-size: 15px;
}
body { --accent: var(--accent-base); }
body[data-state="waiting"] { --accent: var(--warn); }
body[data-state="done"] { --accent: var(--ok); }

/* ---------- base ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--fg);
  font: var(--body-size)/1.4 var(--body-font);
  -webkit-font-smoothing: antialiased; user-select: none;
}
body.hide-cursor, body.hide-cursor * { cursor: none !important; }
canvas#bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
/* Cosmic's slow sky: a quarter-res layer the compositor stretches, so it isn't redrawn every frame. */
canvas#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: none; }
:root[data-theme="cosmic"] canvas#sky { display: block; }

/* Text waits for the theme's web fonts (see boot), so the layout, and which session cards fit, doesn't jump. */
:root.fonts-wait #ui { opacity: 0; }
#ui {
  transition: opacity .25s ease;
  position: fixed; inset: 0; z-index: 1; display: grid; grid-template-rows: auto 1fr;
  padding: clamp(16px, 3vw, 40px) clamp(16px, 4vw, 56px);
  padding-bottom: var(--lane); /* the crab's walking lane */
  pointer-events: none;
}
:root { --side: clamp(16px, 4vw, 56px); --lane: clamp(84px, 11vh, 108px); }
:root[data-theme="cosmic"] { --lane: clamp(16px, 3vw, 40px); }
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; letter-spacing: .01em; }
.brand svg, .brand .mark { width: 22px; height: 22px; }
.brand .sub { color: var(--muted); font-weight: 400; }
.brand .x { color: var(--muted); font-weight: 400; }
.clock { text-align: right; }
.clock .time {
  font: var(--h-weight) clamp(28px, 5vw, 64px)/1 var(--head-font);
  font-variant-numeric: tabular-nums; letter-spacing: var(--h-track);
}
.clock .date { margin-top: 6px; color: var(--muted); font-size: clamp(11px, 1.1vw, 14px); letter-spacing: .12em; text-transform: uppercase; }
.head-right { display: flex; flex-direction: column; align-items: flex-end; gap: clamp(12px, 1.8vh, 18px); flex: none; }

/* ---------- calendar card ---------- */
#cal {
  width: clamp(220px, 21vw, 290px); padding: 12px 15px 13px; border-radius: var(--radius); text-align: left;
  background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--card-shadow);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
#cal:empty { display: none; }
#cal .k { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; }
#cal .k .when { margin-left: auto; letter-spacing: .02em; text-transform: none; font-weight: 500; font-variant-numeric: tabular-nums; }
#cal .k .cdot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
#cal.busy .k { color: var(--fg); }
#cal.busy .k .cdot { background: var(--warn); animation: pulse 2.4s ease-in-out infinite; }
#cal.soon .k .cdot { background: var(--accent-base); }
#cal.soon .k .when { color: var(--accent-base); font-weight: 600; }
#cal .ttl { margin-top: 5px; font-weight: 600; font-size: clamp(14px, 1.25vw, 17px); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
#cal .sub { margin-top: 3px; color: var(--muted); font-size: .88em; font-variant-numeric: tabular-nums; }
#cal .bar { margin-top: 9px; height: 3px; border-radius: 3px; background: var(--card-border); overflow: hidden; }
#cal .bar i { display: block; height: 100%; background: var(--warn); border-radius: inherit; }
#cal .nx { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--card-border); display: flex; gap: 8px; color: var(--muted); font-size: .88em; }
#cal .nx b { color: var(--fg); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#cal .nx span { flex: none; font-variant-numeric: tabular-nums; }
#cal.quiet { padding: 9px 14px; }
:root[data-theme="pixel"] #cal, :root[data-theme="pixel"] #cal .bar { border-radius: 0; }
:root[data-theme="pixel"] #cal .k { font: 8px/1.6 "Press Start 2P", monospace; }
:root[data-theme="pixel"] #cal .k .when { font: 18px/1 "VT323", monospace; }
:root[data-theme="pixel"] #cal .ttl { font-size: 22px; font-weight: 400; }
:root[data-theme="pixel"] #cal .cdot { border-radius: 0; }

/* ---------- plan usage card (Claude's 5-hour and weekly limits, from the status line) ---------- */
/* Under the clock, out of the header's flow (like #sessions on the left), so the header's height, and
   with it the centered headline and task list, doesn't change with how many cards there are. */
.head-right { position: relative; }
#cards {
  position: absolute; right: 0; top: calc(100% + clamp(12px, 1.8vh, 18px));
  display: flex; flex-direction: column; align-items: flex-end; gap: clamp(10px, 1.4vh, 14px);
}

#usage {
  width: clamp(220px, 21vw, 290px); padding: 11px 15px 12px; border-radius: var(--radius); text-align: left;
  background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--card-shadow);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
#usage:empty { display: none; }
#usage .k { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; }
#usage .k .when { margin-left: auto; letter-spacing: .02em; text-transform: none; font-weight: 500; }
#usage .row { margin-top: 8px; }
#usage .l { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: .88em; font-variant-numeric: tabular-nums; white-space: nowrap; }
#usage .l b { color: var(--fg); font-weight: 600; }
#usage .bar { margin-top: 5px; height: 4px; border-radius: 3px; background: var(--card-border); overflow: hidden; }
#usage .bar i { display: block; height: 100%; background: var(--accent-base); border-radius: inherit; }
#usage .row.high .bar i { background: var(--warn); }
#usage .row.high .l b { color: var(--warn); }
:root[data-theme="pixel"] #usage, :root[data-theme="pixel"] #usage .bar { border-radius: 0; }
:root[data-theme="pixel"] #usage .k { font: 8px/1.6 "Press Start 2P", monospace; }
:root[data-theme="pixel"] #usage .k .when { font: 16px/1 "VT323", monospace; }
:root[data-theme="pixel"] #usage .l { font-size: 18px; }

/* The headline sits in the middle row, so it's what's centered: the starburst above it, the rest below.
   centerHeadline() then puts that middle on the screen's center line (the header and the crab's lane differ). */
main {
  display: grid; grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr); justify-items: center;
  text-align: center; row-gap: clamp(8px, 1.6vh, 18px); min-height: 0;
}
#heroSlot { align-self: end; }
main .below { align-self: start; display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.6vh, 18px); }
#heroSlot { width: clamp(96px, 20vmin, 230px); aspect-ratio: 1; flex: none; margin-bottom: clamp(4px, 2vh, 24px); }
h1 {
  font-family: var(--head-font); font-weight: var(--h-weight); font-size: var(--h-size);
  line-height: 1.04; letter-spacing: var(--h-track); text-wrap: balance;
}
h1 em { color: var(--accent); font-style: var(--em-style); transition: color .6s ease; }
#tagline { color: var(--accent); font-size: clamp(14px, 1.6vw, 20px); min-height: 1.5em; transition: color .6s ease; }
#tagline .fade { display: inline-block; }
#spin { display: none; }
/* ---------- message strip ---------- */
.head-left { display: flex; flex-direction: column; align-items: flex-start; gap: clamp(10px, 1.6vh, 16px); min-width: 0; }
#note {
  max-width: min(62vw, 760px);
  display: flex; align-items: center; padding: 12px 22px;
  border-radius: var(--radius); background: var(--note-bg); color: var(--note-fg);
  box-shadow: 0 14px 40px -16px rgba(0,0,0,.55); border: var(--note-border, 0);
}
#note[hidden] { display: none; }
#msg { position: relative; font: var(--note-weight, 500) clamp(18px, 2.2vw, 30px)/1.25 var(--head-font); letter-spacing: -0.01em; }
#msg .word { display: inline-block; white-space: nowrap; }
#msg .ch { display: inline-block; transform-origin: 50% 100%; text-align: center; }
canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
:root[data-theme="warm"] { --note-bg: #f0eee6; --note-fg: #1f1e1d; --note-weight: 400; }
:root[data-theme="pixel"] { --note-bg: #1a1310; --note-fg: #ffd9c4; --note-border: 2px solid #ff7a4d; --note-weight: 400; }
:root[data-theme="pixel"] #msg { font-size: clamp(14px, 1.8vw, 24px); line-height: 1.6; }
:root[data-theme="cosmic"] { --note-bg: rgba(255,255,255,.93); --note-fg: #140c30; --note-weight: 600; }
:root[data-theme="aquarium"] { --note-bg: rgba(240,250,255,.95); --note-fg: #06243f; --note-weight: 600; }
:root[data-theme="aquarium"] h1 em { text-shadow: 0 0 28px color-mix(in srgb, var(--accent) 45%, transparent); }
#nowline {
  display: inline-flex; align-items: center; gap: .65em; max-width: min(92vw, 760px);
  padding: .6em 1.1em; border-radius: 999px;
  background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--card-shadow);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  font-size: clamp(13px, 1.3vw, 16px); white-space: nowrap;
}
#nowline:empty { display: none; }
#nowline .txt { overflow: hidden; text-overflow: ellipsis; }
#nowline .sep { color: var(--muted); }
#nowline .t { color: var(--muted); font-variant-numeric: tabular-nums; }
.dot { width: .62em; height: .62em; border-radius: 50%; background: var(--accent); flex: none; }
body[data-state="working"] .dot, body[data-state="waiting"] .dot { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 .45em color-mix(in srgb, var(--accent) 0%, transparent); transform: scale(.85); } 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } }

/* The agent's task list as a carousel of little cards under the headline: the current task lit, the next ones
   fully readable after it, finished ones dimmed before it, and the row slides along as the agent moves to the
   next task (stepCarousel). */
#plan { width: min(92vw, 900px); }
#plan:empty { display: none; }
#plan .rail {
  overflow: hidden; padding: 4px 0;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
}
#plan .track { display: flex; align-items: stretch; gap: 10px; width: max-content; will-change: transform; }
#plan .tc {
  display: flex; align-items: flex-start; gap: 8px; width: clamp(170px, 16vw, 230px); padding: 8px 13px; text-align: left;
  border-radius: calc(var(--radius) * .75); background: var(--card); border: 1px solid var(--card-border);
  font-size: clamp(12px, 1.15vw, 15px); line-height: 1.3; color: var(--muted);
  transition: opacity .5s ease, transform .5s ease, border-color .5s ease;
}
#plan .tc .tx { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; } /* two lines, so a step's name reads in full */
#plan .tc .ic { margin-top: .12em; }
#plan .tc.pending { color: var(--fg); opacity: .82; }
#plan .tc.completed { opacity: .42; }
#plan .tc.completed .ic { color: var(--fg); opacity: .7; }
#plan .tc.now { color: var(--fg); font-weight: 600; border-color: color-mix(in srgb, var(--accent) 60%, transparent);
  box-shadow: 0 0 22px -6px color-mix(in srgb, var(--accent) 55%, transparent); }
#plan .tc.now .ic { color: var(--accent); }
#plan .ic { width: 1.05em; height: 1.05em; flex: none; display: block; }
#plan .meta { margin-top: 8px; color: var(--muted); font-size: .8em; font-variant-numeric: tabular-nums; white-space: nowrap; }
:root[data-theme="pixel"] #plan .tc { border-radius: 0; font-size: 19px; }

/* Top left, under the brand and the message (in the middle of the left edge they covered wide headlines).
   Out of the header's flow, so the header's height and the centered content don't move. */
.head-left { position: relative; }
#sessions {
  position: absolute; left: 0; top: calc(100% + clamp(10px, 1.6vh, 16px));
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
}
/* The message crab hangs from a letter down to ~0.82 × the message's font size below the strip; stay clear of it. */
#note:not([hidden]) ~ #sessions { top: calc(100% + 10px + .85 * clamp(18px, 2.2vw, 30px)); }
.sess {
  width: 236px; padding: 12px 14px; border-radius: var(--radius); text-align: left;
  background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--card-shadow);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
#sessions .more { padding: 0 4px; color: var(--muted); font-size: .85em; }
.sess .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sess .p { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* The session the middle of the screen is showing (its step and task list). */
.sess.focus {
  border-color: color-mix(in srgb, var(--accent) 60%, transparent);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent), 0 0 26px -4px color-mix(in srgb, var(--accent) 45%, transparent), var(--card-shadow);
}
.sess.focus .p { color: var(--accent); text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 70%, transparent); }
.sess .a { margin-top: 3px; color: var(--muted); font-size: .9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess .tm { margin-top: 2px; color: var(--muted); font-size: .82em; font-variant-numeric: tabular-nums; }
.chip { flex: none; font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; color: var(--chip-ink, var(--bg)); background: var(--chip, var(--accent-base)); }
.chip.waiting { --chip: var(--warn); }
.chip.done { --chip: var(--ok); }
.chip.idle { --chip: var(--card-border); --chip-ink: var(--fg); }

#alert { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .5s ease; box-shadow: inset 0 0 140px 12px var(--warn); }
body[data-state="waiting"] #alert { animation: alert 1.8s ease-in-out infinite; }
@keyframes alert { 0%, 100% { opacity: .15; } 50% { opacity: .65; } }

/* ---------- theme specifics ---------- */
:root[data-theme="pixel"] h1, :root[data-theme="pixel"] .clock .time { text-transform: uppercase; text-shadow: 0 0 12px color-mix(in srgb, var(--accent-base) 45%, transparent); }
:root[data-theme="pixel"] h1::after { content: "_"; color: var(--accent); animation: blink 1s steps(1) infinite; }
:root[data-theme="pixel"] #spin { display: inline; }
:root[data-theme="pixel"] .brand { font-family: "Press Start 2P", monospace; font-size: 12px; }
:root[data-theme="pixel"] .chip { border-radius: 0; font-family: "Press Start 2P", monospace; font-size: 8px; padding: 4px 6px; }
:root[data-theme="pixel"] #nowline { border-radius: 0; }
:root[data-theme="pixel"] body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px),
              radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
}
@keyframes blink { 50% { opacity: 0; } }
:root[data-theme="pixel"] #tagline { font-size: clamp(20px, 2.2vw, 28px); }
:root[data-theme="pixel"] #nowline { font-size: clamp(18px, 1.8vw, 22px); }
:root[data-theme="pixel"] .clock .date { font-size: 16px; }

/* ---------- picker ---------- */
#picker {
  position: fixed; left: 50%; bottom: 16px; z-index: 10; width: min(680px, calc(100vw - 32px));
  transform: translate(-50%, calc(100% + 24px)); opacity: 0;
  transition: transform .45s cubic-bezier(.22, 1, .36, 1), opacity .3s ease;
  padding: 14px; border-radius: 16px; color: #f4f4f5;
  background: rgba(18, 18, 20, .82); border: 1px solid rgba(255,255,255,.1);
  box-shadow: 0 20px 50px -12px rgba(0,0,0,.55);
  backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
  font: 13px/1.4 ui-sans-serif, -apple-system, sans-serif; pointer-events: auto; user-select: auto;
}
#picker.show { transform: translate(-50%, 0); opacity: 1; }
#picker .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#picker .row + .row { margin-top: 10px; }
#picker .lbl { color: rgba(244,244,245,.55); margin-right: 2px; }
#picker button, #picker input[type="text"] {
  font: inherit; color: inherit; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.06);
  border-radius: 10px; padding: 7px 11px;
}
#picker button { cursor: pointer; transition: background .15s ease, transform .1s ease; }
#picker button:hover { background: rgba(255,255,255,.12); }
#picker button:active { transform: scale(.97); }
#picker button[aria-pressed="true"] { background: #f4f4f5; color: #111; border-color: #f4f4f5; }
#picker .themes button { flex: 1; min-width: 120px; display: flex; align-items: center; gap: 8px; justify-content: center; }
#picker .sw { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
#picker input[type="text"] { flex: 1; min-width: 200px; outline: none; }
#picker input[type="text"]:focus { border-color: rgba(255,255,255,.4); }
#picker .tog { display: flex; align-items: center; gap: 6px; margin-left: auto; color: rgba(244,244,245,.75); cursor: pointer; }
#picker .hint { margin-top: 10px; color: rgba(244,244,245,.45); font-size: 12px; }
#picker .hint b { color: rgba(244,244,245,.75); font-weight: 500; }

@media (max-width: 640px) {
  #cal, #usage { display: none; }
  #note { max-width: 100%; }
  #sessions { width: calc(100vw - 2 * var(--side)); }
  .sess { width: 100%; }
  #sessions .sess:nth-child(n+3) { display: none; }
  .brand .sub { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  #alert, .dot, #cal .cdot { animation: none !important; }
}
</style>
</head>
<body data-state="idle">
<canvas id="sky"></canvas>
<canvas id="bg"></canvas>
<div id="alert"></div>
<div id="ui">
  <header>
    <div class="head-left">
      <div class="brand" id="brand"></div>
      <div id="note" hidden><div id="msg"></div></div>
      <div id="sessions"></div>
    </div>
    <div class="head-right">
      <div class="clock"><div class="time" id="time">--:--</div><div class="date" id="date"></div></div>
      <div id="cards"><div id="cal" aria-live="polite"></div><div id="usage"></div></div>
    </div>

  // Crouch just before the leading claw reaches the field; stand as the trailing claw clears it.
  const off = walker.x < 0 ? Infinity : walker.x - mid;
  const ahead = S.state === "working" ? -off * walker.dir : -Math.abs(off); // > 0 while still approaching
  const under = loginUp && (ahead > 0 ? ahead < edge + ps * 0.5 : -ahead < edge) ? 1 : 0;

  const near = loginUp && (ahead > 0 ? ahead < edge + ps * 14 : -ahead < edge + ps * 2);

/* ---------- confetti ---------- */

  }

/* ---------- hero motion ---------- */

/* ---------- canvas + layout ---------- */

// Puts the middle of <main> (where the headline is) on the screen's center line. Layout only: the mouse never moves it.
function centerHeadline() {
  const m = $("main"), dy = innerHeight / 2 - (m.offsetTop + m.offsetHeight / 2);
  m.style.transform = Math.abs(dy) < 0.5 ? "" : `translateY(${dy.toFixed(1)}px)`;
}
function measure() {
  centerHeadline();

  L.hx = h.left + h.width / 2; L.hy = h.top + h.height / 2; L.hr = h.width / 2;
  L.ground = H - 14; // the crab walks in its own lane below everything (see #ui padding-bottom)

// Session cards hang down from the top left; drop the ones that would run into the headline or task list.
function fitSessions() {
  const box = $("#sessions");
  box.querySelector(".more")?.remove();
  const cards = [...box.querySelectorAll(".sess")];
  cards.forEach((c) => (c.style.display = ""));
  const keepOut = ["#headline", "#tagline", "#nowline", "#plan"].map((s) => $(s).getBoundingClientRect()).filter((r) => r.width && r.height);
  const hits = (el) => { const a = el.getBoundingClientRect(); return keepOut.some((b) => a.left < b.right + 16 && a.right > b.left - 16 && a.top < b.bottom + 12 && a.bottom > b.top - 12); };

  more.className = "more";
  box.append(more);
  for (; shown >= 0; shown--) {
    cards.forEach((c, i) => (c.style.display = i < shown ? "" : "none"));
    more.textContent = `+${cards.length - shown} more`;
    if (!hits(more)) return;
  }
}

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); fxg.setTransform(dpr, 0, 0, dpr, 0, 0);
  measure();
  THEME_IMPL[config.theme].init();
}

      this.rays = Array.from({ length: 5 }, (_, i) => ({ x: (i + 0.5) / 5, w: rand(0.03, 0.07), sp: rand(0.05, 0.12), ph: rand(TAU) }));
      this.bubbles = Array.from({ length: 46 }, () => this.newBubble(true));
      this.puffs = [];
      const side = () => (Math.random() < 0.5 ? rand(0.02, 0.3) : rand(0.7, 0.98)); // plants stay clear of the middle
      this.plants = Array.from({ length: 9 }, () => ({ x: side() * W, h: rand(70, 210) * this.k, n: 2 + (Math.random() * 3 | 0), ph: rand(TAU), c: pick(["#2fae6a", "#58d27f", "#1f8a55", "#3fc27a"]), back: Math.random() < 0.45 }));
      this.rocks = Array.from({ length: 6 }, () => ({ x: side() * W, rx: rand(18, 46) * this.k, ry: rand(10, 24) * this.k, c: pick(["#2f4d63", "#3b5d73", "#28465a"]) }));
    },
    newBubble(init) {
      return { x: rand(W), y: init ? rand(H) : L.ground + rand(0, 20), r: rand(1.5, 5) * this.k, v: rand(18, 46), ph: rand(TAU) };
    },
    hash(id) { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); },
    swimBox() { return { x0: W * 0.08, x1: W * 0.92, y0: H * 0.24, y1: L.ground - 90 * this.k }; },
    // The text and cards on screen. Fish pick spots away from them and fade while passing behind,
    // so a white fish never sits behind white text. Measured at most twice a second.
    keepOut(t) {
      if (this.koAt !== undefined && t - this.koAt < 0.5) return this.ko;
      this.koAt = t;
      const els = document.querySelectorAll("#headline, #tagline, #nowline, #plan, #sessions .sess, #cal, #usage, #note, .clock, #brand");
      this.ko = [...els].map((e) => e.getBoundingClientRect()).filter((r) => r.width && r.height);
      return this.ko;
    },
    covered(x, y, pad, t) { return this.keepOut(t).some((r) => x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad); },
    syncFish(live, dt) {
      const seen = new Set();
      for (const s of live) {
        seen.add(s.id);
        if (this.fish.has(s.id)) { this.fish.get(s.id).s = s; continue; }
        const B = this.swimBox();
        this.fish.set(s.id, { s, x: rand(B.x0, B.x1), y: rand(B.y0, B.y1), vx: 0, vy: 0, face: Math.random() < 0.5 ? -1 : 1, tx: 0, ty: 0, retarget: 0,
          fin: this.FINS[this.hash(s.id) % this.FINS.length], ph: rand(TAU), sc: 1, tilt: 0, tap: rand(1), puff: rand(2), alpha: 0, behind: false });
      }
      for (const [id, f] of this.fish) {
        if (seen.has(id)) { f.alpha += clamp((f.behind ? 0.28 : 1) - f.alpha, -dt * 2.5, dt * 1.5); continue; }
        f.alpha -= dt * 1.5; // a session that ended fades out
        if (f.alpha <= 0) this.fish.delete(id);
      }
    },
    steer(f, tx, ty, speed, dt) {
      const dx = tx - f.x, dy = ty - f.y, d = Math.hypot(dx, dy) || 1, v = Math.min(speed, d * 2);
      f.vx += ((dx / d) * v - f.vx) * Math.min(1, dt * 2.2);
      f.vy += ((dy / d) * v - f.vy) * Math.min(1, dt * 2.2);
      f.x += f.vx * dt; f.y += f.vy * dt;
      if (Math.abs(f.vx) > 6) f.face = Math.sign(f.vx);
      return d;
    },
    updateFish(f, t, dt, waitIdx, waitCount) {
      const k = this.k, st = f.s.state === "thinking" ? "working" : f.s.state, B = this.swimBox();
      f.lastMode = f.mode; f.mode = st;
      if (st === "waiting") {
        // Up to the glass beside the hero, alternating sides, and bigger: it's closer to you.
        const slot = waitIdx >> 1, side = waitIdx % 2 ? 1 : -1;
        const tx = clamp(L.hx + side * (L.hr * 1.9 + 70 * k + slot * 130 * k), B.x0, B.x1), ty = L.hy + 10 * k;
        const d = this.steer(f, tx, ty, 160 * k, dt);
        if (d < 30) f.face = side < 0 ? 1 : -1; // facing the middle
        f.sc += (1.55 - f.sc) * Math.min(1, dt * 3);
        f.tilt += (0 - f.tilt) * Math.min(1, dt * 4);
        f.tap = (f.tap + dt / 0.9) % 1;
      } else if (st === "done") {
        // Sink to the sand, somewhere you can see it (not under the task list), and doze there.
        const rest = L.ground - 14 * k;
        if (f.restX === undefined || f.mode !== f.lastMode) {
          f.restX = clamp(f.x, B.x0, B.x1);
          for (let i = 0; i < 16 && this.covered(f.restX, rest, 40 * k, t); i++) f.restX = rand(B.x0, B.x1);
        }
        const d = this.steer(f, f.restX, rest, 40 * k, dt);
        f.sc += (1 - f.sc) * Math.min(1, dt * 2);
        f.tilt += ((d < 8 ? 0.16 : 0.05) - f.tilt) * Math.min(1, dt * 2);
        f.puff -= dt;
        if (f.puff < 0 && d < 8) { f.puff = rand(2.5, 4); this.puffs.push({ x: f.x + f.face * 26 * k, y: f.y - 14 * k, r: 2.5 * k, life: 3 }); }
      } else {
        // Swim between random spots in the tank.
        f.retarget -= dt;
        if (f.retarget <= 0 || Math.hypot(f.tx - f.x, f.ty - f.y) < 24) {
          for (let i = 0; i < 12; i++) { f.tx = rand(B.x0, B.x1); f.ty = rand(B.y0, B.y1); if (!this.covered(f.tx, f.ty, 50 * k, t)) break; }
          f.retarget = rand(4, 9);
        }
        this.steer(f, f.tx, f.ty, 75 * k, dt);
        f.y += Math.sin(t * 2.2 + f.ph) * 6 * k * dt;
        f.sc += (1 - f.sc) * Math.min(1, dt * 2);
        f.tilt += (clamp(f.vy / 220, -0.3, 0.3) - f.tilt) * Math.min(1, dt * 3);
        f.puff -= dt;
        if (f.puff < 0) { f.puff = rand(1.2, 2.6); this.puffs.push({ x: f.x + f.face * 30 * k * f.sc, y: f.y - 4 * k, r: rand(1.5, 3) * k, life: 2.4 }); }
      }
    },
    drawFish(g, f, t, p) {
      const k = this.k * f.sc, st = f.mode, flap = Math.sin(t * (st === "working" ? 11 : st === "waiting" ? 7 : 2.5) + f.ph);
      const lunge = st === "waiting" ? Math.max(0, Math.sin(f.tap * TAU)) ** 6 : 0; // the tap: a quick nudge toward the glass
      g.save(); g.globalAlpha = f.alpha;
      g.translate(f.x + f.face * lunge * 10 * k, f.y); g.rotate(f.tilt * f.face); g.scale(k * f.face, k * (1 + lunge * 0.04));
      // tail and fins: see-through, in this fish's colour
      g.fillStyle = hexA(f.fin, 0.55);
      g.beginPath(); g.moveTo(-24, 0); g.quadraticCurveTo(-36, -4, -46, -15 + flap * 4); g.quadraticCurveTo(-40, 0, -46, 15 - flap * 4); g.quadraticCurveTo(-36, 4, -24, 0); g.fill();
      g.beginPath(); g.ellipse(-5, -19, 12, 6, -0.35 + flap * 0.05, 0, TAU); g.fill();
      // body: a white capsule, a little shaded underneath
      const body = g.createLinearGradient(0, -20, 0, 20);
      body.addColorStop(0, "#ffffff"); body.addColorStop(1, "#c9d8e6");
      g.fillStyle = body; g.beginPath(); g.roundRect ? g.roundRect(-28, -19, 54, 38, 19) : g.ellipse(-1, 0, 27, 19, 0, 0, TAU); g.fill();
      g.fillStyle = hexA(f.fin, 0.85); g.beginPath(); g.arc(-15, 2, 4.2, 0, TAU); g.fill(); // the "ear"
      // visor and eyes
      g.fillStyle = "#0b1526"; g.beginPath(); g.roundRect ? g.roundRect(-5, -13, 27, 24, 10) : g.rect(-5, -13, 27, 24); g.fill();
      g.fillStyle = "rgba(255,255,255,.22)"; g.beginPath(); g.ellipse(4, -9, 7, 2.2, -0.2, 0, TAU); g.fill();
      const eye = st === "waiting" ? p.warn : p.accent;
      g.shadowColor = eye; g.shadowBlur = 6; g.strokeStyle = eye; g.fillStyle = eye; g.lineWidth = 2.2; g.lineCap = "round";
      if (st === "waiting") { for (const ex of [3, 14]) { g.beginPath(); g.arc(ex, -2, 3.3, 0, TAU); g.fill(); } }
      else if (st === "done") { for (const ex of [3, 14]) { g.beginPath(); g.arc(ex, -3, 3, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke(); } } // asleep
      else if ((t + f.ph) % 4.5 < 0.13) { g.beginPath(); g.moveTo(1, -2); g.lineTo(6, -2); g.moveTo(12, -2); g.lineTo(17, -2); g.stroke(); } // blink
      else { for (const ex of [3, 14]) { g.beginPath(); g.moveTo(ex, -5); g.lineTo(ex, 1); g.stroke(); } }
      g.shadowBlur = 0;
      g.fillStyle = hexA(f.fin, 0.6); g.beginPath(); g.ellipse(-6, 12, 7, 3.5, 0.5 + flap * 0.35, 0, TAU); g.fill(); // side fin
      g.restore();
      // ripples on the glass where it taps, and its name underneath
      if (st === "waiting" && f.tap < 0.6) {
        const r = (f.tap / 0.6) * 26 * this.k;
        g.strokeStyle = `rgba(255,255,255,${(0.5 * (1 - f.tap / 0.6) * f.alpha).toFixed(3)})`; g.lineWidth = 1.5;
        g.beginPath(); g.ellipse(f.x + f.face * 30 * k, f.y, r * 0.55, r, 0, 0, TAU); g.stroke();
      }
      if (st === "waiting") bubble(g, f.x + f.face * 6 * k, f.y - 34 * k, Math.max(3, Math.round(4 * this.k)), p.warn, p.eye, "!", "ui-rounded, -apple-system, sans-serif");
      if (config.showDetails) {
        const name = String(f.s.project || "claude"), label = name.length > 22 ? name.slice(0, 21) + "…" : name;
        g.globalAlpha = f.alpha * (st === "done" ? 0.6 : 0.85);
        g.font = `600 ${Math.round(12 * this.k)}px ui-rounded, -apple-system, sans-serif`; g.textAlign = "center";
        g.fillStyle = st === "waiting" ? p.warn : p.fg;
        g.fillText(label, f.x, st === "done" ? f.y - 26 * k : f.y + 34 * k);
        g.globalAlpha = 1;
      }
    },
    drawPlants(g, t, back) {
      for (const pl of this.plants) {
        if (pl.back !== back) continue;
        g.strokeStyle = pl.c; g.lineCap = "round"; g.globalAlpha = back ? 0.55 : 0.95;
        for (let i = 0; i < pl.n; i++) {
          const x = pl.x + (i - (pl.n - 1) / 2) * 9 * this.k, h = pl.h * (0.7 + 0.3 * ((i * 37) % 10) / 10);
          const sway = Math.sin(t * 0.9 + pl.ph + i) * h * 0.18;

      }
      g.globalAlpha = 1;
    },
    draw(g, t, dt, S) {
      const p = PAL.aquarium, k = this.k;
      g.imageSmoothingEnabled = true;
      const bg = g.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "#0b4a7d"); bg.addColorStop(0.55, "#073259"); bg.addColorStop(1, "#04203c");
      g.fillStyle = bg; g.fillRect(0, 0, W, H);

        const gr = g.createLinearGradient(0, 0, 0, H * 0.9);

      }
      const col = stateColor(p, S.state), hp = S.hero, R = L.hr * 2.6;
      const glow = g.createRadialGradient(L.hx, L.hy, 0, L.hx, L.hy, R);
      glow.addColorStop(0, hexA(col, 0.3)); glow.addColorStop(1, hexA(col, 0));
      g.fillStyle = glow; g.fillRect(L.hx - R, L.hy - R, R * 2, R * 2);

      this.drawPlants(g, t, true);
      // the fish
      this.syncFish(S.live || [], dt);
      const waiting = [...this.fish.values()].filter((f) => f.s.state === "waiting").sort((a, b) => String(a.s.id).localeCompare(String(b.s.id)));
      for (const f of this.fish.values()) { this.updateFish(f, t, dt, waiting.indexOf(f), waiting.length); f.behind = f.mode !== "waiting" && this.covered(f.x, f.y, 20 * this.k, t); }

      g.globalAlpha = 1;
      // sand, rocks, the front plants
      const sand = g.createLinearGradient(0, L.ground - 10, 0, H);
      sand.addColorStop(0, "#c9ad74"); sand.addColorStop(1, "#8f7447");
      g.fillStyle = sand; g.beginPath(); g.moveTo(0, H);
      for (let x = 0; x <= W; x += 24) g.lineTo(x, L.ground + 1 + Math.sin(x * 0.013) * 3 + Math.sin(x * 0.041) * 1.5);
      g.lineTo(W, H); g.fill();
      for (const r of this.rocks) {
        g.fillStyle = r.c; g.beginPath(); g.ellipse(r.x, L.ground + 4, r.rx, r.ry, 0, Math.PI, TAU); g.fill();
        g.fillStyle = "rgba(255,255,255,.08)"; g.beginPath(); g.ellipse(r.x - r.rx * 0.3, L.ground + 4 - r.ry * 0.6, r.rx * 0.35, r.ry * 0.18, -0.2, 0, TAU); g.fill();
      }
      this.drawPlants(g, t, false);
      drawGroundCrab(g, dt, S, p, Math.round(clamp(W / 220, 3, 8)), W, L.ground, "ui-rounded, -apple-system, sans-serif");

      for (const [x0, x1] of [[0, 34], [W, W - 34]]) {
        const gl = g.createLinearGradient(x0, 0, x1, 0);

        g.fillStyle = gl; g.fillRect(Math.min(x0, x1), 0, 34, H);

    },
  },

};

/* ---------- status derivation ---------- */
function makeDemo(kind) {
  const now = Date.now();
  const list = [
    { id: "d1", project: "web-app", state: "working", action: "Update the settings page styles", task_started: now - 754e3, updated_at: now,
      plan: [["Read the settings page and theme tokens", "completed"], ["Add a dark color palette", "completed"], ["Follow the system appearance", "completed"], ["Wire up the appearance switch", "completed"], ["Update the settings page styles", "in_progress"], ["Run the tests and fix failures", "pending"]].map(([text, status]) => ({ text, status })) },
    { id: "d2", project: "api-server", state: "thinking", action: "Thinking", task_started: now - 128e3, updated_at: now },
    { id: "d3", project: "docs-site", state: "done", action: "Finished", task_started: now - 1500e3, done_at: now - 180e3, updated_at: now - 180e3 },
  ];
  if (kind === "waiting") Object.assign(list[0], { state: "waiting", action: "Claude needs your permission to use Bash" });
  if (kind === "done") {
    list.forEach((s, i) => Object.assign(s, { state: "done", action: "Finished", done_at: now - i * 240e3 - 5e3 }));
    list[0].plan.forEach((p) => (p.status = "completed"));
  }
  return kind === "idle" ? [] : list;
}
const RANK = { waiting: 0, working: 1, thinking: 1, done: 2, idle: 3 };
const DONE_MS = 10 * 60e3;
// A working session that hasn't reported anything for a while has probably stalled (an interrupted turn sends no
// Stop): it drops below the ones really working and the recently finished ones, and isn't picked for the headline.
// "Thinking" reports often, so 5 min; inside one tool (a long build, say) nothing arrives until it ends, so 20 min.
const isWorking = (s) => s.state === "working" || s.state === "thinking";
const isActive = (s, now) => now - (s.updated_at || 0) <= (s.state === "thinking" ? 5 : 20) * 60e3;
const activeRank = (s, now) => (isWorking(s) && !isActive(s, now) ? 2.5 : RANK[s.state]);
// Several sessions in the same state: stay on one and rotate every 12s, instead of jumping

    .pv-mac-login { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); display: grid; justify-items: center; gap: 8px; }
    .pv-mac-pfp { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; background: linear-gradient(180deg, #b8bec7, #8a919c); box-shadow: 0 4px 14px rgba(0, 0, 0, .3); }
    .pv-mac-pfp svg { width: 100%; height: 100%; fill: #eef0f3; }
    .pv-mac-name { font-size: 15px; font-weight: 600; }
    .pv-mac-field { width: 172px; padding: 6px 14px; border-radius: 999px; background: rgba(255, 255, 255, .22); backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px); font-size: 13px; color: rgba(255, 255, 255, .62); text-align: left; text-shadow: none; }
    .pv-mac-hint { font-size: 12px; opacity: .72; }
    @media (prefers-reduced-motion: reduce) { .pv-mac { transition: none; } }`;
  document.head.append(css);
  const mac = document.createElement("div");
  mac.className = "pv-mac";
  mac.setAttribute("aria-hidden", "true");
  mac.innerHTML = `<div class="pv-mac-clock"><div class="pv-mac-date"></div><div class="pv-mac-time"></div></div>
    <div class="pv-mac-login"><div class="pv-mac-pfp"><svg viewBox="0 0 64 64"><circle cx="32" cy="25" r="11"/><path d="M12 54c2-11 10-17 20-17s18 6 20 17"/></svg></div>
    <div class="pv-mac-name"></div><div class="pv-mac-field">Enter Password</div><div class="pv-mac-hint">Touch ID or Enter Password</div></div>`;
  mac.querySelector(".pv-mac-name").textContent = qs.get("user") || "Your Name";
  document.body.append(mac);

  const LOCK_UI_TIMEOUT = 29400; // what loginwindow uses (see the screensaver)
  let lastInput = 0, shown = false;
  const show = (on) => {
    if (on === shown) return;
    shown = on;
    mac.classList.toggle("on", on);
    window.setSystemLockUI(on);
  };
  const touched = () => { lastInput = Date.now(); show(true); };
  for (const ev of ["pointerenter", "pointermove", "pointerdown", "keydown", "wheel"]) document.addEventListener(ev, touched, { passive: true });
  document.documentElement.addEventListener("pointerleave", () => show(false));
  addEventListener("blur", () => show(false));
  setInterval(() => { if (shown && Date.now() - lastInput >= LOCK_UI_TIMEOUT) show(false); }, 100);
  // macOS's lock-screen clock: date above, hours and minutes without AM/PM.
  const tick = () => {
    const now = new Date();
    mac.querySelector(".pv-mac-date").textContent = now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
    mac.querySelector(".pv-mac-time").textContent = new Intl.DateTimeFormat([], { hour: "numeric", minute: "2-digit" })
      .formatToParts(now).filter((x) => x.type !== "dayPeriod").map((x) => x.value).join("").trim();
  };
  tick();
  setInterval(tick, 1000);
}
</script>
</body>
