name: Release

# Builds the app on an Apple silicon runner and attaches the zip and its .sha256 to the release.
# Start it by publishing a release on GitHub (tag vX.Y.Z), or by hand from the Actions tab with a tag.
# Required secret GOOGLE_CLIENT_JSON: the contents of google-client.json (the Google OAuth "Desktop app" client),
# so official downloads have Google Calendar sign-in. The job stops if it's missing.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload to (e.g. v1.1.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Google client
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: |
          if [ -z "$GOOGLE_CLIENT_JSON" ]; then
            echo "::error::Add the GOOGLE_CLIENT_JSON secret (Settings → Secrets and variables → Actions). Official releases must have Google sign-in."
            exit 1
          fi
          printf '%s' "$GOOGLE_CLIENT_JSON" > google-client.json
          echo "REQUIRE_GOOGLE=1" >> "$GITHUB_ENV"
      - name: Build zip and SHA-256
        run: VERSION="${TAG#v}" macos/release.sh
      - name: Remove the Google client file
        if: always()
        run: rm -f google-client.json
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.zip dist/*.sha256 --clobber --repo "$GITHUB_REPOSITORY"
