name: Release

# Pushing a tag vX.Y.Z builds the app once on an Apple silicon runner and puts the zip and its .sha256 in a
# DRAFT release, with notes from macos/release-notes/RELEASE-NOTES-X.Y.Z.md. Test that exact zip, then publish
# the draft by hand. Publishing doesn't rebuild, so the published zip and SHA-256 are the ones you tested.
# Required secret GOOGLE_CLIENT_JSON: the contents of google-client.json (the Google OAuth "Desktop app" client),
# so official downloads have Google Calendar sign-in. The job stops if it's missing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build into a draft release (e.g. v1.1.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refuse to replace a published release
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "::error::$TAG is already published. Its zip and SHA-256 must not change."
            exit 1
          fi
      - name: Check the release notes exist
        run: test -f "macos/release-notes/RELEASE-NOTES-${TAG#v}.md"
      - name: Google client
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: |
          if [ -z "$GOOGLE_CLIENT_JSON" ]; then
            echo "::error::Add the GOOGLE_CLIENT_JSON secret (Settings → Secrets and variables → Actions). Official releases must have Google sign-in."
            exit 1
          fi
          printf '%s' "$GOOGLE_CLIENT_JSON" > google-client.json
          echo "REQUIRE_GOOGLE=1" >> "$GITHUB_ENV"
      - name: Build zip and SHA-256
        run: VERSION="${TAG#v}" macos/release.sh
      - name: Remove the Google client file
        if: always()
        run: rm -f google-client.json
      - name: Put them in a draft release
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Agent Aquarium ${TAG#v}" --notes-file "macos/release-notes/RELEASE-NOTES-${TAG#v}.md"
          fi
          gh release upload "$TAG" dist/*.zip dist/*.sha256 --clobber --repo "$GITHUB_REPOSITORY"
