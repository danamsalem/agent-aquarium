<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Agent Fishtank</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a3550"/>
      <stop offset="1" stop-color="#04121f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd3c6" stop-opacity=".30"/>
      <stop offset="1" stop-color="#5fd3c6" stop-opacity=".08"/>
    </linearGradient>
    <clipPath id="inside"><rect x="100" y="138" width="312" height="262" rx="54"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
