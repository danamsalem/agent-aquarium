  <circle cx="216" cy="302" r="9" fill="#e8f4f6"/><circle cx="219" cy="301" r="4" fill="#04121f"/>
  <circle cx="245" cy="310" r="9" fill="#e8f4f6"/><circle cx="248" cy="309" r="4" fill="#04121f"/>
  <g transform="translate(176 338)">
    <circle r="34" fill="#e8f4f6"/>
    <path d="M0 0c0-8 10-10 15-4 7 8 1 22-13 22C-14 18-22 4-17-9-11-24 12-28 25-15" fill="none" stroke="#072a3d" stroke-width="8" stroke-linecap="round"/>
