  <circle cx="336" cy="252" r="32" fill="#ff8a5c"/>
  <circle cx="325" cy="242" r="9" fill="#ffd2bf"/>
  <circle cx="300" cy="216" r="7" fill="#e8f4f6" opacity=".45"/>
