    <path d="M90 214c34-20 68-20 102 0s68 20 102 0 68-20 102 0 34 20 34 20V420H90z" fill="url(#water)"/>
    <path d="M90 352c60-14 120-14 180-4s110 10 152 0V420H90z" fill="#5fd3c6" opacity=".22"/>
  </g>
  <path d="M104 214c30-18 60-18 92 0s68 20 102 0 68-20 102 0" fill="none" stroke="#5fd3c6" stroke-width="14" stroke-linecap="round"/>
  <rect x="100" y="138" width="312" height="262" rx="54" fill="none" stroke="#5fd3c6" stroke-width="22"/>
  <!-- lid -->
  <rect x="82" y="104" width="348" height="30" rx="15" fill="#5fd3c6"/>
